version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # SQLite (varsayılan) yerine PostgreSQL kullanmak isterseniz aşağıdaki satırı açın
      # ve requirements.txt'ye `asyncpg` ekleyip db servisini etkinleştirin:
      # DATABASE_URL: postgresql+asyncpg://subrecon:subrecon@db:5432/subrecon
      DATABASE_URL: sqlite+aiosqlite:///./data/subrecon.db

